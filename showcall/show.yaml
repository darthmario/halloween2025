rules:
  - kind: bursts
    track: fog
    above: 0.005
    maxMs: 5000
    minGapMs: 30000
    note: "Mirrors the node's FogGuard: a burst is cut at 5 s, and one starting within 30 s of the last one ending is dropped (the fogger reheats for 30-40 s; pumping sooner sprays liquid). above 0.005 = pump level 1 of 115."
  - kind: telegraph
    track: fogRGB
    before: fog
    leadMs: 2000
    note: "Telegraph rule (payoff, not ambush): swell the fogger's light from toxic green to hot white-green in the 2 s before fog fires."
